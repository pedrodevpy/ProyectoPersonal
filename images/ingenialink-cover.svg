<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Ilustración: importación de datos RFID hacia una base de datos y API</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151b"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0263b"/><stop offset="1" stop-color="#ff5a6b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Tres hojas Excel (entrada) -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#9a9aa6">
    <g transform="translate(110 150)">
      <rect width="180" height="120" rx="10" fill="#1c1c24" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="14" y="16" width="152" height="12" rx="3" fill="#2a2a34"/>
      <rect x="14" y="40" width="120" height="10" rx="3" fill="#2a2a34"/>
      <rect x="14" y="60" width="140" height="10" rx="3" fill="#2a2a34"/>
      <rect x="14" y="80" width="100" height="10" rx="3" fill="#2a2a34"/>
      <text x="90" y="140" text-anchor="middle" font-size="15">lote_A.xlsx</text>
    </g>
    <g transform="translate(110 320)">
      <rect width="180" height="120" rx="10" fill="#1c1c24" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="14" y="16" width="152" height="12" rx="3" fill="#2a2a34"/>
      <rect x="14" y="40" width="130" height="10" rx="3" fill="#2a2a34"/>
      <rect x="14" y="60" width="110" height="10" rx="3" fill="#2a2a34"/>
      <rect x="14" y="80" width="150" height="10" rx="3" fill="#2a2a34"/>
      <text x="90" y="140" text-anchor="middle" font-size="15">lote_B.xlsx</text>
    </g>
    <g transform="translate(110 490)">
      <rect width="180" height="120" rx="10" fill="#1c1c24" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="14" y="16" width="152" height="12" rx="3" fill="#2a2a34"/>
      <rect x="14" y="40" width="100" height="10" rx="3" fill="#2a2a34"/>
      <rect x="14" y="60" width="150" height="10" rx="3" fill="#2a2a34"/>
      <rect x="14" y="80" width="120" height="10" rx="3" fill="#2a2a34"/>
      <text x="90" y="140" text-anchor="middle" font-size="15">lote_C.xlsx</text>
    </g>
  </g>

  <!-- Flechas de convergencia -->
  <g fill="none" stroke="url(#red)" stroke-width="3" stroke-linecap="round">
    <path d="M300 210 C 380 210, 380 375, 460 375"/>
    <path d="M300 380 L 460 380"/>
    <path d="M300 550 C 380 550, 380 385, 460 385"/>
  </g>

  <!-- Módulo de validación e importación -->
  <g transform="translate(470 270)">
    <rect width="260" height="220" rx="16" fill="#1c1c24" stroke="#e0263b" stroke-opacity="0.7" stroke-width="2"/>
    <text x="130" y="44" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Importación unificada</text>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#c9c9d2">
      <text x="28" y="88"><tspan fill="#4ade80">✓</tspan> campos obligatorios</text>
      <text x="28" y="120"><tspan fill="#4ade80">✓</tspan> formatos</text>
      <text x="28" y="152"><tspan fill="#4ade80">✓</tspan> duplicados</text>
      <text x="28" y="184"><tspan fill="#e0263b">→</tspan> plantilla única</text>
    </g>
  </g>

  <!-- Flecha hacia BD -->
  <path d="M740 380 L 830 380" fill="none" stroke="url(#red)" stroke-width="3" stroke-linecap="round"/>
  <path d="M818 370 L 832 380 L 818 390" fill="none" stroke="#ff5a6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base de datos -->
  <g transform="translate(860 300)">
    <ellipse cx="90" cy="20" rx="90" ry="20" fill="#2a2a34" stroke="#ffffff" stroke-opacity="0.15"/>
    <path d="M0 20 V140 A90 20 0 0 0 180 140 V20" fill="#1c1c24" stroke="#ffffff" stroke-opacity="0.15"/>
    <path d="M0 60 A90 20 0 0 0 180 60" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M0 100 A90 20 0 0 0 180 100" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="90" y="195" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#9a9aa6">Trazabilidad RFID</text>
  </g>

  <!-- API / código de barras -->
  <g transform="translate(880 120)">
    <rect width="150" height="60" rx="10" fill="#1c1c24" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="#ffffff" fill-opacity="0.85">
      <rect x="18" y="16" width="3" height="28"/><rect x="25" y="16" width="6" height="28"/><rect x="35" y="16" width="2" height="28"/>
      <rect x="41" y="16" width="5" height="28"/><rect x="50" y="16" width="3" height="28"/><rect x="57" y="16" width="7" height="28"/>
      <rect x="68" y="16" width="2" height="28"/><rect x="74" y="16" width="4" height="28"/><rect x="82" y="16" width="6" height="28"/>
      <rect x="92" y="16" width="3" height="28"/><rect x="99" y="16" width="5" height="28"/><rect x="108" y="16" width="2" height="28"/>
      <rect x="114" y="16" width="6" height="28"/><rect x="124" y="16" width="3" height="28"/>
    </g>
  </g>
  <path d="M955 185 L 955 290" fill="none" stroke="url(#red)" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <text x="1045" y="215" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#e0263b">POST /api</text>

  <!-- Onda RFID -->
  <g fill="none" stroke="#e0263b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" transform="translate(1010 560)">
    <circle cx="0" cy="0" r="8" fill="#e0263b" stroke="none"/>
    <path d="M22 -22 A31 31 0 0 1 22 22"/>
    <path d="M40 -40 A56 56 0 0 1 40 40" stroke-opacity="0.6"/>
    <path d="M58 -58 A82 82 0 0 1 58 58" stroke-opacity="0.3"/>
  </g>
</svg>
