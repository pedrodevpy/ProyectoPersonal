<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Ilustración: motor de reservas multi-inquilino que rechaza solapamientos mediante restricciones de exclusión GiST en PostgreSQL</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151518"/><stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0263b"/><stop offset="1" stop-color="#ff5a6b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Encabezado -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <text x="80" y="88" fill="#ff3b4e" font-size="20" font-weight="600" letter-spacing="3.3">PEVLYN AGENDA</text>
    <text x="80" y="140" fill="#f4f4f5" font-size="40" font-weight="700">Reservas sin solapamientos</text>
  </g>

  <!-- Línea de tiempo del día -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="17" fill="#70707a">
    <line x1="80" y1="258" x2="1120" y2="258" stroke="#ffffff" stroke-opacity="0.14"/>
    <g text-anchor="middle">
      <text x="80" y="292">08:00</text>
      <text x="340" y="292">10:00</text>
      <text x="600" y="292">12:00</text>
      <text x="860" y="292">14:00</text>
      <text x="1120" y="292">16:00</text>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.14">
      <line x1="80" y1="252" x2="80" y2="264"/>
      <line x1="340" y1="252" x2="340" y2="264"/>
      <line x1="600" y1="252" x2="600" y2="264"/>
      <line x1="860" y1="252" x2="860" y2="264"/>
      <line x1="1120" y1="252" x2="1120" y2="264"/>
    </g>
  </g>

  <!-- Citas confirmadas -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">
    <g>
      <rect x="80" y="186" width="190" height="56" rx="12" fill="url(#red)"/>
      <text x="100" y="221">Cita confirmada</text>
    </g>
    <g>
      <rect x="360" y="186" width="210" height="56" rx="12" fill="url(#red)"/>
      <text x="380" y="221">Cita confirmada</text>
    </g>
    <g>
      <rect x="880" y="186" width="200" height="56" rx="12" fill="url(#red)"/>
      <text x="900" y="221">Cita confirmada</text>
    </g>
  </g>

  <!-- Intento solapado, rechazado -->
  <g>
    <rect x="520" y="330" width="230" height="56" rx="12" fill="#1d1d21"
          stroke="#ff3b4e" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="548" y="365" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="17" font-weight="600" fill="#ff3b4e">Intento solapado</text>
    <!-- Conector hacia la cita en conflicto -->
    <path d="M565 330 L565 250" fill="none" stroke="#ff3b4e" stroke-opacity="0.5"
          stroke-width="2" stroke-dasharray="6 6"/>
    <!-- Marca de rechazo -->
    <circle cx="782" cy="358" r="19" fill="none" stroke="#ff3b4e" stroke-width="2.5"/>
    <path d="M775 351 L789 365 M789 351 L775 365" stroke="#ff3b4e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="820" y="365" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="17" fill="#a2a2a9">rechazado en la base de datos</text>
  </g>

  <!-- Restricción de exclusión -->
  <g>
    <rect x="80" y="430" width="1040" height="72" rx="14" fill="#1d1d21" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="108" y="474" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#f4f4f5">
      <tspan fill="#ff6b7d">EXCLUDE USING</tspan> gist (negocio_id <tspan fill="#ff6b7d">WITH =</tspan>, franja <tspan fill="#ff6b7d">WITH &amp;&amp;</tspan>)
    </text>
  </g>

  <!-- Aislamiento por inquilino -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <g transform="translate(80 540)">
      <rect width="330" height="78" rx="14" fill="#1d1d21" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="24" y="23" width="32" height="32" rx="8" fill="rgba(255,59,78,0.14)"/>
      <path d="M34 39 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#ff3b4e" stroke-width="2.4"/>
      <rect x="32" y="39" width="16" height="12" rx="3" fill="#ff3b4e"/>
      <text x="76" y="37" font-size="18" font-weight="600" fill="#f4f4f5">Negocio A</text>
      <text x="76" y="60" font-size="15" fill="#a2a2a9">datos aislados</text>
    </g>
    <g transform="translate(435 540)">
      <rect width="330" height="78" rx="14" fill="#1d1d21" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="24" y="23" width="32" height="32" rx="8" fill="rgba(255,59,78,0.14)"/>
      <path d="M34 39 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#ff3b4e" stroke-width="2.4"/>
      <rect x="32" y="39" width="16" height="12" rx="3" fill="#ff3b4e"/>
      <text x="76" y="37" font-size="18" font-weight="600" fill="#f4f4f5">Negocio B</text>
      <text x="76" y="60" font-size="15" fill="#a2a2a9">datos aislados</text>
    </g>
    <g transform="translate(790 540)">
      <rect width="330" height="78" rx="14" fill="#1d1d21" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="24" y="23" width="32" height="32" rx="8" fill="rgba(255,59,78,0.14)"/>
      <path d="M34 39 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#ff3b4e" stroke-width="2.4"/>
      <rect x="32" y="39" width="16" height="12" rx="3" fill="#ff3b4e"/>
      <text x="76" y="37" font-size="18" font-weight="600" fill="#f4f4f5">Negocio C</text>
      <text x="76" y="60" font-size="15" fill="#a2a2a9">datos aislados</text>
    </g>
  </g>
</svg>
